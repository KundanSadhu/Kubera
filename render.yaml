# Render Blueprint — matches exact settings from deploy guide
# Create flow: Dashboard → New + → Blueprint → select KundanSadhu/Kubera
# Or manual: New + → PostgreSQL (kubera-db) + New + → Web Service (kubera-backend)
services:
  - type: web
    name: kubera-backend
    runtime: python
    rootDir: kubera/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kubera-db
          property: connectionString
        # NOTE: app auto-converts postgresql:// → postgresql+asyncpg://
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@kubera.local
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: OPENAI_API_KEY
        sync: false
      - key: LITELLM_MODEL
        value: openai/gpt-4o-mini
      - key: WHATSAPP_MODE
        value: mock

databases:
  - name: kubera-db
    databaseName: kubera
    plan: free
    # Region: select closest (e.g. Singapore) in dashboard — blueprint uses default region
